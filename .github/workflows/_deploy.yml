# Reusable pipeline (called by deploy-staging.yml and deploy-production.yml).
# WHY one job for migrate -> functions -> panel: a GitHub Environment with required reviewers asks
# for approval once per job, and production should ask once. Step order gives the same sequencing.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment (staging or production)
        required: true
        type: string
      pages-branch:
        description: Cloudflare Pages branch (develop or main)
        required: true
        type: string
      publish-ota:
        description: Publish an EAS Update to the environment channel
        required: true
        type: boolean

permissions:
  contents: read

# WHY cancel-in-progress false: cancelling a run halfway through `db push` would leave a half-applied deploy.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.121.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Verificar secretos y variables
        env:
          NAMES: SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_ANON_KEY PANEL_ORIGINS APP_ORIGINS PUBLIC_APP_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PANEL_ORIGINS: ${{ vars.PANEL_ORIGINS }}
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          missing=""
          for name in $NAMES; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos o variables en el entorno '${{ inputs.environment }}':$missing. Ver docs/ekko_despliegue.md"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # 1. migrate
      - name: Migraciones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      # 2. functions
      - name: Secretos de las Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PANEL_ORIGINS: ${{ vars.PANEL_ORIGINS }}
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          # Optional: only set when present (push still works on Expo's anonymous quota; Apple revocation fails closed without them).
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
        run: |
          args=("PANEL_ORIGINS=$PANEL_ORIGINS" "APP_ORIGINS=$APP_ORIGINS")
          for name in EXPO_ACCESS_TOKEN APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY APPLE_CLIENT_ID; do
            [ -z "${!name}" ] || args+=("$name=${!name}")
          done
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"
      - name: Desplegar Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy send-push delete-account --project-ref "$SUPABASE_PROJECT_REF"

      # 3. panel
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build del panel
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_PANEL }}
        run: pnpm --filter @ekko/panel build
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/panel/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=${{ inputs.pages-branch }}

  ota:
    if: inputs.publish-ota
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Verificar secretos y variables
        env:
          NAMES: EXPO_TOKEN
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          missing=""
          for name in $NAMES; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos o variables en el entorno '${{ inputs.environment }}':$missing. Ver docs/ekko_despliegue.md"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 25.x
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # NOTE: EXPO_PUBLIC_* come from the EAS environment of the same name (docs/ekko_despliegue.md), not from GitHub.
      - name: Publicar EAS Update
        env:
          CHANNEL: ${{ inputs.environment }}
        run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --non-interactive --message "$GITHUB_SHA"
